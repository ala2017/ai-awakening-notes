    (function () {
      var audio = document.getElementById('bgm');
      var btn = document.querySelector('.nav-bgm');
      if (!audio || !btn) return;

      function paint() {
        var on = !audio.paused;
        btn.setAttribute('data-state', on ? 'playing' : 'paused');
        btn.setAttribute('aria-label', (on ? '暂停' : '播放') + '背景音乐：弦音未殇');
      }
      function kick() {
        if (audio.paused) {
          var a = audio.play();
          if (a && a.catch) a.catch(function () {});
        }
      }

      // 客户端路由会换掉 body，这段脚本每次导航都重跑；而 audio 是
      // transition:persist 留下来的同一个元素，所以拿它的 dataset 认门，只绑一次。
      // 否则翻几次页就叠了几层监听，点一下会切换好几回。
      if (audio.dataset.bound !== '1') {
        audio.dataset.bound = '1';
        btn.addEventListener('click', function () {
          if (audio.paused) kick(); else audio.pause();
        });
        audio.addEventListener('play', paint);
        audio.addEventListener('pause', paint);
      }

      paint();
      kick();   // 每次进页先直接试一次——浏览器放行时（老读者）就响了

      // 浏览器会拦掉"没有用户手势的自动播放"，这是策略，不是代码能绕的。
      // 退一步：把读者的第一次交互当作那个手势。
      // document 跨客户端导航是同一个对象，所以监听只装一次；一响就卸掉，
      // 之后点哪儿、点多少次都不会再触发。点按钮自己不在此列（否则会先响再停）。
      if (!window.__bgmArmed) {
        window.__bgmArmed = 1;
        var off = function () {
          document.removeEventListener('pointerdown', onGesture, true);
          document.removeEventListener('keydown', onGesture, true);
        };
        var onGesture = function (e) {
          if (e.target && e.target.closest && e.target.closest('.nav-bgm')) return;
          kick();
          if (!audio.paused) off();
        };
        document.addEventListener('pointerdown', onGesture, true);
        document.addEventListener('keydown', onGesture, true);
      }
    })();
  </script></body> </html>
